<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetario &amp; Food Cost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B19;
    --surface:#26241F;
    --card:#2F2C26;
    --card-hover:#37332C;
    --line:#433F37;
    --gold:#D9A544;
    --gold-dim:#8A6B33;
    --cream:#F2ECE1;
    --muted:#9C948A;
    --sage:#8AA06E;
    --sage-bg:#2B3324;
    --amber:#D9A544;
    --amber-bg:#3A2F1A;
    --brick:#C0603F;
    --brick-bg:#3A2419;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  input,select,button{font-family:'Inter',sans-serif;font-size:14px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::placeholder{color:#6b655c;}

  /* ---------- Login ---------- */
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:40px 36px;width:340px;}
  .login-card h1{font-size:26px;color:var(--gold);letter-spacing:0.3px;}
  .login-card .sub{color:var(--muted);font-size:13px;margin-top:6px;margin-bottom:26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input,.field select{width:100%;padding:10px 12px;background:#1F1E1B;border:1px solid var(--line);border-radius:4px;color:var(--cream);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold-dim);}
  .btn{cursor:pointer;border:none;border-radius:4px;padding:10px 16px;font-weight:600;font-size:13px;transition:transform .08s;}
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:var(--gold);color:#1C1B19;}
  .btn-gold:hover{background:#E5B45C;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--cream);}
  .btn-ghost:hover{background:var(--card-hover);}
  .btn-danger{background:transparent;border:1px solid var(--brick);color:var(--brick);}
  .btn-danger:hover{background:var(--brick-bg);}
  .btn-full{width:100%;}
  .error-msg{background:var(--brick-bg);color:#E8927A;border:1px solid var(--brick);padding:8px 12px;border-radius:4px;font-size:13px;margin-bottom:16px;}
  .hint{margin-top:20px;font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px;}

  /* ---------- App shell ---------- */
  #app-screen{display:none;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface);}
  header.topbar .brand{display:flex;align-items:center;gap:10px;}
  header.topbar .brand h1{font-size:19px;color:var(--gold);}
  header.topbar .brand span{font-size:11px;color:var(--muted);}
  .user-chip{display:flex;align-items:center;gap:12px;}
  .role-badge{font-size:11px;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.4px;font-weight:600;}
  .role-admin{background:var(--amber-bg);color:var(--amber);}
  .role-chef{background:var(--sage-bg);color:var(--sage);}
  .role-visualizador{background:#332F2A;color:var(--muted);}

  nav.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;}
  nav.tabs button{background:none;border:none;color:var(--muted);padding:14px 16px;font-size:13.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  nav.tabs button:hover{color:var(--cream);}
  nav.tabs button.active{color:var(--gold);border-bottom-color:var(--gold);}
  nav.tabs .tab-add{color:var(--muted);font-size:16px;padding:14px 12px;}

  main{padding:26px 28px;max-width:1180px;margin:0 auto;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .toolbar h2{font-size:20px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .recipe-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;cursor:pointer;transition:background .1s,border-color .1s;}
  .recipe-card:hover{background:var(--card-hover);border-color:var(--gold-dim);}
  .recipe-card h3{font-size:15.5px;margin-bottom:4px;}
  .recipe-card .cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:12px;}
  .recipe-card .rows{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
  .recipe-card .rows b{color:var(--cream);font-family:'JetBrains Mono',monospace;}
  .fc-badge{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
  .fc-good{background:var(--sage-bg);color:var(--sage);}
  .fc-warn{background:var(--amber-bg);color:var(--amber);}
  .fc-bad{background:var(--brick-bg);color:var(--brick);}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;}

  /* ---------- Editor ---------- */
  .editor-overlay{position:fixed;inset:0;background:rgba(10,9,7,0.7);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:100;}
  .editor{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%;max-width:760px;padding:28px 30px;margin-bottom:40px;}
  .editor h2{color:var(--gold);margin-bottom:20px;}
  .row2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}
  table.ing-table{width:100%;border-collapse:collapse;margin-top:8px;}
  table.ing-table th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;padding:6px 8px;border-bottom:1px solid var(--line);}
  table.ing-table td{padding:6px 8px;border-bottom:1px solid #34312B;}
  table.ing-table input,table.ing-table select{width:100%;padding:7px 8px;background:#1F1E1B;border:1px solid var(--line);border-radius:4px;color:var(--cream);}
  .subtotal-cell{font-family:'JetBrains Mono',monospace;color:var(--gold);text-align:right;white-space:nowrap;}
  .del-ing{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
  .del-ing:hover{color:var(--brick);}
  .add-ing-btn{margin-top:10px;font-size:12.5px;padding:7px 12px;}

  .summary-box{margin-top:22px;background:#1F1E1B;border:1px solid var(--line);border-radius:6px;padding:18px 20px;}
  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .summary-grid .field{margin-bottom:0;}
  .stat-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px solid #302D28;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row span:last-child{font-family:'JetBrains Mono',monospace;color:var(--gold);font-weight:600;}
  .editor-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}

  /* ---------- Users tab ---------- */
  table.user-table{width:100%;border-collapse:collapse;}
  table.user-table th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:10px 8px;border-bottom:1px solid var(--line);}
  table.user-table td{padding:10px 8px;border-bottom:1px solid #302D28;font-size:13.5px;}
  .add-user-form{display:flex;gap:10px;align-items:end;margin-top:20px;background:var(--card);padding:16px;border-radius:6px;border:1px solid var(--line);}
  .add-user-form .field{margin-bottom:0;flex:1;}

  .view-only-note{background:var(--amber-bg);color:var(--amber);font-size:12.5px;padding:8px 14px;border-radius:4px;margin-bottom:16px;display:inline-block;}
  .loading{text-align:center;padding:100px 20px;color:var(--muted);}

  /* ---------- Home ---------- */
  .home-title{margin-bottom:22px;}
  .home-title h2{font-size:22px;}
  .home-title p{color:var(--muted);font-size:13.5px;margin-top:6px;}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
  .home-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px 20px;cursor:pointer;transition:background .1s,border-color .1s;}
  .home-card:hover{background:var(--card-hover);border-color:var(--gold-dim);}
  .home-card .tag{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;}
  .home-card h3{font-size:17px;margin-bottom:6px;}
  .home-card p{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;}
  .breadcrumb-home{color:var(--gold);font-weight:600;}
  .resumen-cat-row td{background:#1F1E1B;font-weight:600;color:var(--gold);font-size:11.5px;text-transform:uppercase;letter-spacing:0.4px;}

  /* ---------- Ayuda ---------- */
  .help-section{margin-bottom:26px;}
  .help-section h3{font-size:16px;color:var(--gold);margin-bottom:8px;}
  .help-section p{font-size:13.5px;line-height:1.65;color:var(--cream);margin:0 0 8px;}
  .help-section p.dim{color:var(--muted);}
  .help-example{background:#1F1E1B;border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin:10px 0;font-size:13px;}
  .help-example b{color:var(--gold);}
  .help-steps{margin:0;padding-left:0;list-style:none;counter-reset:step;}
  .help-steps li{counter-increment:step;padding:10px 0 10px 34px;position:relative;font-size:13.5px;color:var(--cream);border-bottom:1px solid #302D28;}
  .help-steps li:last-child{border-bottom:none;}
  .help-steps li::before{content:counter(step);position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1C1B19;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .faq-item{border-bottom:1px solid #302D28;padding:12px 0;}
  .faq-item .q{font-weight:600;font-size:13.5px;margin-bottom:5px;}
  .faq-item .a{font-size:13px;color:var(--muted);line-height:1.6;}

  /* ---------- Imagen y manual de la receta ---------- */
  .recipe-card .thumb{width:100%;height:120px;object-fit:cover;border-radius:4px;margin-bottom:10px;background:#1F1E1B;}
  .img-upload-box{border:1px dashed var(--line);border-radius:6px;padding:14px;text-align:center;margin-bottom:6px;}
  .img-upload-box img{max-width:100%;max-height:180px;border-radius:4px;display:block;margin:0 auto 10px;}
  .img-upload-box input[type=file]{color:var(--muted);font-size:12.5px;}
  textarea.manual-input{width:100%;min-height:120px;padding:10px 12px;background:#1F1E1B;border:1px solid var(--line);border-radius:4px;color:var(--cream);font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.55;resize:vertical;}
  .manual-view{white-space:pre-wrap;font-size:13.5px;line-height:1.65;background:#1F1E1B;border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Recetario</h1>
    <div class="sub">Control de recetas y food cost</div>
    <div id="login-error"></div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="usuario" onkeydown="if(event.key==='Enter') handleLogin()">
    </div>
    <div class="field">
      <label>Clave</label>
      <input type="password" id="login-pass" placeholder="clave" onkeydown="if(event.key==='Enter') handleLogin()">
    </div>
    <button class="btn btn-gold btn-full" onclick="handleLogin()">Ingresar</button>
    <div class="hint" id="login-hint"></div>
  </div>
</div>

<div id="app-screen">
  <header class="topbar">
    <div class="brand">
      <h1>Recetario</h1>
      <span>Costos &amp; Food Cost</span>
    </div>
    <div class="user-chip">
      <span class="role-badge" id="role-badge"></span>
      <span id="user-name" class="mono" style="font-size:13px;color:var(--muted)"></span>
      <button class="btn btn-ghost" onclick="handleLogout()">Salir</button>
    </div>
  </header>
  <nav class="tabs" id="tabs-bar"></nav>
  <main id="main-content"></main>
</div>

<div id="editor-root"></div>
<div id="picker-root"></div>

<script>
/* ============================================================
   CONFIGURACIÓN — completá esto con los datos de tu proyecto
   de Supabase (Panel > Project Settings > API).
   ============================================================ */
const SUPABASE_URL = 'https://jiypceebrhbgwygcgjlo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_uNvK6N0zT4v7OglbKXpW6w_uPl2bN-m';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let appData = null;
let currentUser = null;
let currentSection = 'home';
let activeTab = null;
let editingRecipe = null;
let adjuntosAbiertos = false;

const UNIDADES = ['g','kg','ml','l','unidad'];

async function loadData(){
  const [catsRes, matsRes, recsRes, usersRes] = await Promise.all([
    sb.from('categorias').select('*').order('orden'),
    sb.from('materiales').select('*').eq('eliminado', false),
    sb.from('recetas').select('*').eq('eliminado', false),
    sb.from('usuarios').select('id,usuario,rol')
  ]);

  if(catsRes.error || matsRes.error || recsRes.error || usersRes.error){
    throw (catsRes.error || matsRes.error || recsRes.error || usersRes.error);
  }

  appData = {
    categories: catsRes.data.map(c => c.nombre),
    materiales: matsRes.data.map(m => ({
      id: m.id, nombre: m.nombre, unidad: m.unidad, contenido: Number(m.contenido),
      costoTotal: Number(m.costo_total), costoUnitario: Number(m.costo_unitario),
      mermaPct: Number(m.merma_pct || 0),
      generadoPorReceta: m.generado_por_receta,
      creadoPor: m.creado_por, creadoEn: m.creado_en, modificadoPor: m.modificado_por, modificadoEn: m.modificado_en
    })),
    recipes: recsRes.data.map(r => ({
      id: r.id, nombre: r.nombre, categoria: r.categoria,
      porciones: Number(r.porciones), multiplicador: Number(r.multiplicador),
      imagen: r.imagen,
      manualPdf: r.manual_pdf_data ? {name: r.manual_pdf_nombre, data: r.manual_pdf_data} : null,
      usarComoMateriaPrima: r.usar_como_materia_prima, materialLinkId: r.material_link_id,
      rendimientoGramos: r.rendimiento_gramos ? Number(r.rendimiento_gramos) : null,
      seVende: r.se_vende !== false,
      usaPorciones: r.usa_porciones !== false,
      usarPrecioManual: r.usar_precio_manual === true,
      precioVentaManual: r.precio_venta_manual ? Number(r.precio_venta_manual) : null,
      ingredientes: r.ingredientes || [],
      creadoPor: r.creado_por, creadoEn: r.creado_en, modificadoPor: r.modificado_por, modificadoEn: r.modificado_en
    })),
    users: usersRes.data
  };
}

async function refresh(){
  await loadData();
  renderNavBar();
  renderMain();
}

function fechaHora(iso){
  if(!iso) return '\u2014';
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
}

function money(n){
  if(isNaN(n)) n = 0;
  return '$' + n.toFixed(2);
}

function moneyPrecio(n){
  if(isNaN(n)) n = 0;
  return '$' + n.toFixed(4);
}

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

/* ---------------- LOGIN ---------------- */

async function handleLogin(){
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-error');
  const btn = document.querySelector('#login-screen .btn-gold');
  btn.disabled = true;
  btn.textContent = 'Ingresando…';

  try{
    const {data, error} = await sb.from('usuarios').select('*').eq('usuario', u).maybeSingle();
    if(error) throw error;
    const ok = data && dcodeIO.bcrypt.compareSync(p, data.password_hash);
    if(!ok){
      errEl.innerHTML = '<div class="error-msg">Usuario o clave incorrectos.</div>';
      return;
    }
    errEl.innerHTML = '';
    currentUser = {id: data.id, usuario: data.usuario, rol: data.rol};
    await loadData();
    currentSection = 'home';
    activeTab = appData.categories[0] || null;
    showApp();
  }catch(e){
    console.error(e);
    errEl.innerHTML = `<div class="error-msg">No se pudo conectar: ${escapeHtml(e.message || 'error desconocido')}</div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
}

const SESSION_TIMEOUT_MS = 25 * 60 * 1000;
let inactivityTimer = null;

function resetInactivityTimer(){
  if(!currentUser) return;
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    handleLogout();
    alert('Tu sesión se cerró automáticamente después de 25 minutos sin actividad. Volvé a ingresar.');
  }, SESSION_TIMEOUT_MS);
}
['click','keydown','scroll'].forEach(ev => document.addEventListener(ev, resetInactivityTimer));

function handleLogout(){
  currentUser = null;
  currentSection = 'home';
  clearTimeout(inactivityTimer);
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-name').textContent = currentUser.usuario;
  const rb = document.getElementById('role-badge');
  rb.textContent = currentUser.rol;
  rb.className = 'role-badge role-' + currentUser.rol;
  resetInactivityTimer();
  renderNavBar();
  renderMain();
}

function canEdit(){
  return currentUser.rol === 'admin' || currentUser.rol === 'chef';
}
function isAdmin(){
  return currentUser.rol === 'admin';
}

/* ---------------- NAVEGACIÓN POR SECCIONES ---------------- */

function renderNavBar(){
  const bar = document.getElementById('tabs-bar');
  if(currentSection === 'home'){
    bar.innerHTML = '';
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  let html = `<button class="breadcrumb-home" onclick="goHome()">&larr; Inicio</button>`;
  if(currentSection === 'recetas'){
    appData.categories.forEach(c => {
      html += `<button class="${activeTab===c?'active':''}" onclick="switchTab('${escapeAttr(c)}')">${escapeHtml(c)}</button>`;
    });
    if(isAdmin()){
      html += `<button class="tab-add" title="Agregar categoría" onclick="addCategory()">+</button>`;
    }
  }
  bar.innerHTML = html;
}

function goHome(){
  currentSection = 'home';
  renderNavBar();
  renderMain();
}

function goSection(section){
  currentSection = section;
  if(section === 'recetas' && !activeTab){
    activeTab = appData.categories[0] || null;
  }
  renderNavBar();
  renderMain();
}

function switchTab(t){
  activeTab = t;
  renderNavBar();
  renderMain();
}

async function addCategory(){
  const name = prompt('Nombre de la nueva categoría:');
  if(!name) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  if(appData.categories.includes(trimmed)){ alert('Esa categoría ya existe.'); return; }
  const {error} = await sb.from('categorias').insert({nombre: trimmed, orden: appData.categories.length});
  if(error){ alert('No se pudo crear la categoría: ' + error.message); return; }
  activeTab = trimmed;
  await refresh();
}

async function deleteCategory(cat){
  const inUse = appData.recipes.some(r => r.categoria === cat);
  if(inUse){ alert('No puedes eliminar una categoría que tiene recetas cargadas.'); return; }
  if(!confirm(`¿Eliminar la categoría "${cat}"? Esta acción no se puede deshacer.`)) return;
  const {error} = await sb.from('categorias').delete().eq('nombre', cat);
  if(error){ alert('No se pudo eliminar: ' + error.message); return; }
  activeTab = null;
  await refresh();
  activeTab = appData.categories[0] || null;
  renderNavBar();
  renderMain();
}

/* ---------------- MAIN CONTENT ---------------- */

let homeSearchQuery = '';

function onHomeSearchInput(v){
  homeSearchQuery = v;
  const q = v.trim().toLowerCase();
  const box = document.getElementById('home-search-results');
  if(!box) return;
  if(!q){ box.innerHTML = ''; return; }

  const recetas = appData.recipes.filter(r => r.nombre.toLowerCase().includes(q)).slice(0, 6);
  const materiales = appData.materiales.filter(m => m.nombre.toLowerCase().includes(q)).slice(0, 6);

  if(recetas.length === 0 && materiales.length === 0){
    box.innerHTML = `<div class="empty" style="padding:16px;">Sin resultados para "${escapeHtml(v)}".</div>`;
    return;
  }

  let html = '';
  recetas.forEach(r => {
    html += `<div onclick="irARecetaDesdeHome('${r.id}','${escapeAttr(r.categoria)}')" style="padding:10px 12px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;" onmouseover="this.style.background='var(--card-hover)'" onmouseout="this.style.background='transparent'">
      <span>${escapeHtml(r.nombre)}</span><span class="fc-badge fc-good" style="margin-top:0;">Receta</span>
    </div>`;
  });
  materiales.forEach(m => {
    html += `<div onclick="irAMaterialDesdeHome('${m.id}')" style="padding:10px 12px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;" onmouseover="this.style.background='var(--card-hover)'" onmouseout="this.style.background='transparent'">
      <span>${escapeHtml(m.nombre)}</span><span class="fc-badge fc-warn" style="margin-top:0;">Insumo</span>

}

}

function irAMaterialDesdeHome(id){

function renderResumen(){
  let html = `<div class="toolbar"><h2>Resumen general</h2></div>`;
  if(appData.recipes.length === 0){
    return html + `<div class="empty">Todavía no hay recetas cargadas.</div>`;
  }
  const sorted = appData.recipes.slice().sort((a,b) =>
    a.categoria.localeCompare(b.categoria) || a.nombre.localeCompare(b.nombre));

  html += `<table class="user-table">
    <tr><th>Área</th><th>Plato</th><th>Costo por porción</th><th>Precio de venta</th><th>Food cost</th><th>Última modificación</th></tr>`;
  let lastCat = null;
  sorted.forEach(r => {
    if(r.categoria !== lastCat){
      html += `<tr class="resumen-cat-row"><td colspan="6">${escapeHtml(r.categoria)}</td></tr>`;
      lastCat = r.categoria;
    }
    const t = computeTotals(r);
    const fcClass = t.foodCostPct <= 30 ? 'fc-good' : (t.foodCostPct <= 38 ? 'fc-warn' : 'fc-bad');
    html += `<tr>
      <td style="color:var(--muted);">${escapeHtml(r.categoria)}</td>
      <td>${escapeHtml(r.nombre)}</td>
      <td class="mono">${money(t.costoPorPorcion)}</td>
      ${r.seVende ? `
      <td class="mono">${money(t.precioVenta)}</td>
      <td><span class="fc-badge ${fcClass}">${t.foodCostPct.toFixed(1)}%</span></td>` : `
      <td colspan="2" style="color:var(--muted);font-size:12px;">No se vende (insumo interno)</td>`}
      <td style="font-size:11.5px;color:var(--muted);">${r.modificadoPor ? `${escapeHtml(r.modificadoPor)}, ${fechaHora(r.modificadoEn)}` : (r.creadoPor ? `${escapeHtml(r.creadoPor)}, ${fechaHora(r.creadoEn)}` : '\u2014')}</td>
    </tr>`;
  });
  html += `</table>`;
  return html;
}

let papeleraCache = null;

async function loadYRenderPapelera(){
  const [matsRes, recsRes] = await Promise.all([
    sb.from('materiales').select('*').eq('eliminado', true),
    sb.from('recetas').select('*').eq('eliminado', true)
  ]);
  if(matsRes.error || recsRes.error){
    document.getElementById('main-content').innerHTML = `<div class="empty">No se pudo cargar la papelera.</div>`;
    return;
  }
  papeleraCache = {materiales: matsRes.data, recetas: recsRes.data};
  document.getElementById('main-content').innerHTML = renderPapelera();
}

function renderPapelera(){
  if(!papeleraCache) return '<div class="empty">Cargando papelera&hellip;</div>';
  const items = [];
  papeleraCache.recetas.forEach(r => items.push({tipo:'Receta', id:r.id, nombre:r.nombre, eliminadoPor:r.eliminado_por, eliminadoEn:r.eliminado_en}));
  papeleraCache.materiales.forEach(m => items.push({tipo:'Insumo', id:m.id, nombre:m.nombre, eliminadoPor:m.eliminado_por, eliminadoEn:m.eliminado_en}));
  items.sort((a,b) => new Date(b.eliminadoEn||0) - new Date(a.eliminadoEn||0));

  let html = `<div class="toolbar"><h2>Papelera</h2></div>`;
  if(items.length === 0){
    return html + `<div class="empty">La papelera está vacía.</div>`;
  }
  html += `<table class="user-table"><tr><th>Tipo</th><th>Nombre</th><th>Eliminado por</th><th>Cuándo</th><th></th></tr>`;
  items.forEach(it => {
    html += `<tr>
      <td><span class="fc-badge fc-warn" style="margin-top:0;">${it.tipo}</span></td>
      <td>${escapeHtml(it.nombre)}</td>
      <td>${it.eliminadoPor ? escapeHtml(it.eliminadoPor) : '\u2014'}</td>
      <td class="mono" style="font-size:12px;">${fechaHora(it.eliminadoEn)}</td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn btn-ghost" style="padding:5px 10px;font-size:12px;" onclick="restaurarDePapelera('${it.tipo}','${it.id}')">Restaurar</button>
        <button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" onclick="borrarDefinitivo('${it.tipo}','${it.id}')">Eliminar definitivamente</button>
      </td>
    </tr>`;
  });
  html += `</table>`;
  return html;
}

async function restaurarDePapelera(tipo, id){
  const tabla = tipo === 'Receta' ? 'recetas' : 'materiales';
  const {error} = await sb.from(tabla).update({eliminado: false, eliminado_por: null, eliminado_en: null}).eq('id', id);
  if(error){ alert('No se pudo restaurar: ' + error.message); return; }
  await loadYRenderPapelera();
  await loadData();
}

async function borrarDefinitivo(tipo, id){
  if(!confirm('Esto lo borra para siempre y ya no se puede restaurar. ¿Continuar?')) return;
  const tabla = tipo === 'Receta' ? 'recetas' : 'materiales';
  const {error} = await sb.from(tabla).delete().eq('id', id);
  if(error){ alert('No se pudo eliminar: ' + error.message); return; }
  await loadYRenderPapelera();
}

function renderAuditoria(){
  const items = [];
  appData.recipes.forEach(r => items.push({
    tipo: 'Receta', nombre: r.nombre, creadoPor: r.creadoPor, creadoEn: r.creadoEn,
    modificadoPor: r.modificadoPor, modificadoEn: r.modificadoEn
  }));
  appData.materiales.forEach(m => items.push({
    tipo: 'Insumo', nombre: m.nombre, creadoPor: m.creadoPor, creadoEn: m.creadoEn,
    modificadoPor: m.modificadoPor, modificadoEn: m.modificadoEn
  }));

  let html = `<div class="toolbar"><h2>Auditoría: creación y cambios</h2></div>`;
  if(items.length === 0){
    return html + `<div class="empty">Todavía no hay recetas ni insumos cargados.</div>`;
  }

  items.sort((a,b) => new Date(b.modificadoEn || b.creadoEn || 0) - new Date(a.modificadoEn || a.creadoEn || 0));

    <tr><th>Tipo</th><th>Nombre</th><th>Creado por</th><th>Creado el</th><th>Última modificación</th></tr>`;
  items.forEach(it => {

      <td><span class="fc-badge fc-warn" style="margin-top:0;">${it.tipo}</span></td>

      <td>${it.creadoPor ? escapeHtml(it.creadoPor) : '<span style="color:var(--muted);">\u2014</span>'}</td>
      <td class="mono" style="font-size:12px;">${fechaHora(it.creadoEn)}</td>
      <td style="font-size:12.5px;">${it.modificadoPor ? `${escapeHtml(it.modificadoPor)} <span class="mono" style="color:var(--muted);font-size:11.5px;">(${fechaHora(it.modificadoEn)})</span>` : '<span style="color:var(--muted);">Sin modificaciones</span>'}</td>
    </tr>`;
  });
  html += `</table>`;
  return html;
}

function renderAyuda(){
  return `
  <div class="toolbar"><h2>Ayuda: cómo funciona el sistema</h2></div>

  <div class="help-section">
    <h3>¿Qué es el costo de una receta?</h3>
    <p>Es lo que te cuesta realmente producir un plato: la suma del costo de cada insumo que usás, según la cantidad que la receta necesita.</p>
    <div class="help-example">
      <b>Ejemplo:</b> si una milanesa usa 200 g de carne (a $0.05 el gramo) y 50 g de pan rallado (a $0.02 el gramo), el costo es 200×$0.05 + 50×$0.02 = $11.00.
    </div>
  </div>

  <div class="help-section">
    <h3>¿Qué es el Food Cost?</h3>
    <p>Es el porcentaje que representa el costo de un plato sobre su precio de venta. Te dice qué parte de lo que cobrás se va en materia prima.</p>
    <p class="dim">Food cost % = (costo del plato ÷ precio de venta) × 100</p>
    <p>En general, un food cost saludable está entre <b style="color:var(--sage)">25% y 33%</b>. Por eso en el sistema los platos se marcan en verde (bajo), amarillo (moderado) o rojo (alto), para detectar de un vistazo qué recetas convienen y cuáles hay que revisar.</p>
  </div>

  <div class="help-section">
    <h3>¿Qué es la merma?</h3>
    <p>Es lo que se pierde de un insumo al procesarlo: cáscaras, recortes, lo que se evapora al cocinar, etc. Si comprás 1 kg de algo pero al pelarlo o limpiarlo solo te quedan 900 g utilizables, tenés un 10% de merma.</p>
    <p>Al cargar el insumo en Materia prima podés poner ese porcentaje, y el sistema sube el costo por unidad automáticamente (porque en la práctica necesitás comprar más para obtener la cantidad que realmente usás). Esto se aplica solo si ese insumo tiene merma cargada; si dejás el campo en 0, el costo no cambia.</p>
  </div>

  <div class="help-section">
    <h3>¿Qué es el multiplicador y el margen de ganancia?</h3>
    <p>El <b>multiplicador</b> es por cuánto se multiplica el costo para llegar al precio de venta (por ejemplo, x3 significa que el precio es 3 veces el costo). El <b>margen de ganancia</b> es el porcentaje de ese precio que queda como ganancia.</p>
    <p>Podés escribir cualquiera de los dos en el editor de la receta: si cambiás el multiplicador, el margen se recalcula solo, y viceversa.</p>
  </div>

  <div class="help-section">
    <h3>Cómo cargar un insumo (materia prima)</h3>
    <ol class="help-steps">
      <li>Entrá a "Modificar precio de materia prima" desde el inicio.</li>
      <li>Escribí el nombre del insumo (ej: Harina).</li>
      <li>Elegí la unidad (gramos, kilos, ml, litros o unidad).</li>
      <li>Indicá cuánto trae el paquete que compraste (ej: 1000 si es una bolsa de 1000 g).</li>
      <li>Indicá cuánto pagaste en total por ese paquete, en $.</li>
      <li>El sistema calcula solo el costo por gramo/ml/unidad, y ese es el que se usa después en las recetas.</li>
    </ol>
  </div>

  <div class="help-section">
    <h3>Cómo crear una receta paso a paso</h3>
    <ol class="help-steps">
      <li>Entrá a "Modificar una receta" y elegí el área (Entradas, Principales, etc.). Si no existe, un admin puede crearla con el botón "+".</li>
      <li>Tocá "+ Nueva receta".</li>
      <li>Escribí el nombre del plato y cuántas porciones rinde la receta.</li>
      <li>En la tabla de insumos, buscá cada ingrediente por nombre (tiene que estar cargado antes en Materia prima) y elegilo de la lista.</li>
      <li>Escribí la cantidad que usa la receta de ese insumo. El costo unitario y el subtotal se calculan solos.</li>
      <li>Agregá una fila por cada insumo con el botón "+ Agregar insumo".</li>
      <li>Definí el multiplicador o el margen de ganancia deseado.</li>
      <li>Revisá el costo total, el precio de venta sugerido y el food cost antes de guardar.</li>
      <li>Tocá "Guardar receta".</li>
    </ol>
  </div>

  <div class="help-section">
    <h3>Preguntas frecuentes</h3>
    <div class="faq-item">
      <div class="q">¿Por qué no encuentro un ingrediente al crear la receta?</div>
      <div class="a">Porque todavía no está cargado en "Materia prima". Hay que agregarlo ahí primero; después va a aparecer en el buscador de la receta.</div>
    </div>
    <div class="faq-item">
      <div class="q">Si sube el precio de un insumo, ¿tengo que editar todas las recetas que lo usan?</div>
      <div class="a">No. Actualizás el precio una sola vez en Materia prima, y el costo de todas las recetas que lo usan se actualiza solo.</div>
    </div>
    <div class="faq-item">
      <div class="q">¿Quién puede editar recetas y precios?</div>
      <div class="a">Los usuarios con rol admin o chef. El rol visualizador solo puede ver, no puede crear, editar ni eliminar nada.</div>
    </div>
    <div class="faq-item">
      <div class="q">¿Dónde veo todos los platos juntos con su food cost?</div>
      <div class="a">En "Ver resumen general", desde el inicio: ahí están todas las recetas agrupadas por área con su costo, precio y food cost.</div>
    </div>
    <div class="faq-item">
      <div class="q">¿Puedo borrar un insumo de Materia prima?</div>
      <div class="a">Sí, siempre que no esté siendo usado en ninguna receta. Si está en uso, el sistema no deja borrarlo para no romper los cálculos.</div>
    </div>
  </div>`;
}

function renderMain(){
  const main = document.getElementById('main-content');
  if(currentSection === 'home'){
    main.innerHTML = renderHome();
    return;
  }
  if(currentSection === 'usuarios'){
    main.innerHTML = renderUsersTab();
    return;
  }
  if(currentSection === 'materiales'){
    main.innerHTML = renderMaterialesTab();
    return;
  }
  if(currentSection === 'resumen'){
    main.innerHTML = renderResumen();
    return;
  }
  if(currentSection === 'auditoria'){
    main.innerHTML = renderAuditoria();
    return;
  }
  if(currentSection === 'papelera'){
    main.innerHTML = '<div class="empty">Cargando papelera&hellip;</div>';
    loadYRenderPapelera();
    return;
  }
  if(currentSection === 'ayuda'){
    main.innerHTML = renderAyuda();
    return;
  }
  if(!activeTab){
    main.innerHTML = `<div class="empty">Todavía no hay categorías. ${isAdmin() ? 'Crea una con el botón +.' : ''}</div>`;
    return;
  }
  const recipes = appData.recipes.filter(r => r.categoria === activeTab);
  let html = `<div class="toolbar"><h2>${escapeHtml(activeTab)}</h2>`;
  if(canEdit()){
    html += `<div style="display:flex;gap:8px;">
      ${isAdmin() ? `<button class="btn btn-danger" onclick="deleteCategory('${escapeAttr(activeTab)}')">Eliminar categoría</button>` : ''}
      <button class="btn btn-gold" onclick="openEditor(null)">+ Nueva receta</button>
    </div>`;
  } else {
    html += `<span class="view-only-note">Modo lectura</span>`;
  }
  html += `</div>`;

  if(recipes.length === 0){
    html += `<div class="empty">Sin recetas en esta categoría todavía.</div>`;
    main.innerHTML = html;
    return;
  }

  html += `<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
    <input id="recipe-search" placeholder="Buscar receta por nombre&hellip;" value="${escapeAttr(recipeSearchQuery)}" oninput="onRecipeSearchInput(this.value)" style="flex:1;min-width:200px;padding:9px 12px;background:#1F1E1B;border:1px solid var(--line);border-radius:4px;color:var(--cream);">
    <div style="display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;">
      <button class="btn ${recipeViewMode==='grid'?'btn-gold':'btn-ghost'}" style="border:none;border-radius:0;padding:9px 14px;" onclick="setRecipeViewMode('grid')">Cuadrícula</button>
      <button class="btn ${recipeViewMode==='list'?'btn-gold':'btn-ghost'}" style="border:none;border-radius:0;padding:9px 14px;" onclick="setRecipeViewMode('list')">Lista</button>
    </div>
  </div>`;

  if(recipeViewMode === 'list'){
    html += `<table class="user-table"><tr><th></th><th>Receta</th><th>Porciones</th><th>Costo por porción</th><th>Precio venta</th><th>Food cost</th></tr>`;
    recipes.forEach(r => {
      const totals = computeTotals(r);
      const fcClass = totals.foodCostPct <= 30 ? 'fc-good' : (totals.foodCostPct <= 38 ? 'fc-warn' : 'fc-bad');
      html += `<tr data-recipe-name="${escapeAttr(r.nombre.toLowerCase())}" style="cursor:pointer;" onclick="openEditor('${r.id}')">
        <td>${r.imagen ? `<img src="${r.imagen}" style="width:34px;height:34px;object-fit:cover;border-radius:4px;">` : ''}</td>
        <td>${escapeHtml(r.nombre)}</td>
        <td class="mono">${r.porciones}</td>
        <td class="mono">${money(totals.costoPorPorcion)}</td>
        ${r.seVende ? `
        <td class="mono">${money(totals.precioVenta)}</td>
        <td><span class="fc-badge ${fcClass}">${totals.foodCostPct.toFixed(1)}%</span></td>` : `
        <td colspan="2" style="color:var(--muted);font-size:12px;">No se vende (insumo interno)</td>`}
      </tr>`;
    });
    html += `</table>`;
  } else {
    html += `<div class="grid">`;
    recipes.forEach(r => {
      const totals = computeTotals(r);
      const fcClass = totals.foodCostPct <= 30 ? 'fc-good' : (totals.foodCostPct <= 38 ? 'fc-warn' : 'fc-bad');
      html += `<div class="recipe-card" data-recipe-name="${escapeAttr(r.nombre.toLowerCase())}" onclick="openEditor('${r.id}')">
        ${r.imagen ? `<img class="thumb" src="${r.imagen}">` : ''}
        <h3>${escapeHtml(r.nombre)}</h3>
        <div class="cat">${r.usaPorciones ? `${r.porciones} porción${r.porciones==1?'':'es'} &middot; ` : ''}x${totals.multiplicadorEfectivo.toFixed(1)}${totals.usaManual ? ' (manual)' : ''}</div>
        <div class="rows"><span>Costo total</span><b>${money(totals.costoTotal)}</b></div>
        ${r.seVende ? `
        <div class="rows"><span>Precio venta</span><b>${money(totals.precioVenta)}</b></div>
        <span class="fc-badge ${fcClass}">Food cost ${totals.foodCostPct.toFixed(1)}%</span>` : `
        <span class="fc-badge fc-warn" style="margin-top:10px;">No se vende &middot; insumo interno</span>`}
      </div>`;
    });
    html += `</div>`;
  }
  main.innerHTML = html;
  filterRecipeList(recipeSearchQuery);
}

let recipeSearchQuery = '';
let recipeViewMode = 'grid';

function onRecipeSearchInput(v){
  recipeSearchQuery = v;
  filterRecipeList(v);
}

function filterRecipeList(q){
  const query = (q || '').trim().toLowerCase();
  document.querySelectorAll('[data-recipe-name]').forEach(el => {
    const name = el.getAttribute('data-recipe-name');
    const isRow = el.tagName === 'TR';
    el.style.display = name.includes(query) ? (isRow ? 'table-row' : '') : 'none';
  });
}

function setRecipeViewMode(mode){
  recipeViewMode = mode;
  renderMain();
}

function renderUsersTab(){
  let html = `<div class="toolbar"><h2>Usuarios</h2></div>`;

async function addUser(){
  const usuario = document.getElementById('nu-usuario').value.trim();
  const clave = document.getElementById('nu-clave').value;
  const rol = document.getElementById('nu-rol').value;
  if(!usuario || !clave){ alert('Completa usuario y clave.'); return; }
  if(clave.length < 4){ alert('La clave debe tener al menos 4 caracteres.'); return; }
  if(appData.users.some(u => u.usuario === usuario)){ alert('Ese usuario ya existe.'); return; }
  const password_hash = dcodeIO.bcrypt.hashSync(clave, 10);
  const {error} = await sb.from('usuarios').insert({usuario, password_hash, rol});
  if(error){ alert('No se pudo crear el usuario: ' + error.message); return; }
  await refresh();
}

async function deleteUser(usuario){
  if(!confirm(`¿Eliminar al usuario "${usuario}"? Esta acción no se puede deshacer.`)) return;
  const {error} = await sb.from('usuarios').delete().eq('usuario', usuario);
  if(error){ alert('No se pudo eliminar: ' + error.message); return; }
  await refresh();
}

let editingMaterialId = null;

let materialSort = 'nombre-asc';
let materialFilterUnidad = 'todas';

function onMaterialSearchInput(v){
  materialSearchQuery = v;
  renderMain();
  setTimeout(() => {
    const el = document.getElementById('mat-search');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 0);
}

function setMaterialSort(v){ materialSort = v; renderMain(); }
function setMaterialFilterUnidad(v){ materialFilterUnidad = v; renderMain(); }

function unidadEquivalente(m){
  const grupo = UNIT_GROUP[m.unidad];
  const opciones = UNIT_GROUP_OPCIONES[grupo] || [];
  return opciones.find(u => u !== m.unidad) || null;
}

function costoEnUnidadEquivalente(m){
  const otra = unidadEquivalente(m);
  if(!otra) return null;
  const factor = unitConversionFactor(otra, m.unidad) || 1;
  return {unidad: otra, costo: materialCosto(m.id) * factor};
}

function previewMatCosto(){
  const contenido = parseFloat(document.getElementById('mat-contenido').value) || 0;
  const costoTotal = parseFloat(document.getElementById('mat-costo-total').value) || 0;
  const merma = parseFloat(document.getElementById('mat-merma').value) || 0;
  const base = contenido > 0 ? costoTotal / contenido : 0;
  const efectivo = (merma > 0 && merma < 100) ? base / (1 - merma / 100) : base;
  document.getElementById('mat-costo-preview').textContent = moneyPrecio(efectivo);
}

const UNIT_GROUP = {g:'peso', kg:'peso', ml:'volumen', l:'volumen', unidad:'unidad'};
const UNIT_BASE = {g:1, kg:1000, ml:1, l:1000};
const UNIT_GROUP_OPCIONES = {peso:['g','kg'], volumen:['ml','l'], unidad:['unidad']};

function unitConversionFactor(fromU, toU){
  if(fromU === toU) return 1;
  if(UNIT_GROUP[fromU] !== UNIT_GROUP[toU]) return null;
  return UNIT_BASE[fromU] / UNIT_BASE[toU];
}

let pendingMaterialSave = null;

async function saveMaterial(){
  const nombre = document.getElementById('mat-nombre').value.trim();
  const unidad = document.getElementById('mat-unidad').value;
  const contenido = parseFloat(document.getElementById('mat-contenido').value) || 0;
  const costoTotal = parseFloat(document.getElementById('mat-costo-total').value) || 0;
  const mermaPct = Math.min(95, Math.max(0, parseFloat(document.getElementById('mat-merma').value) || 0));
  if(!nombre){ alert('Ponle un nombre al insumo.'); return; }
  if(contenido <= 0){ alert('Indicá cuántos gramos (o ml/unidades) trae el paquete.'); return; }

  const dup = appData.materiales.find(m => m.nombre.toLowerCase() === nombre.toLowerCase() && m.id !== editingMaterialId);
  if(dup){ alert('Ya existe un insumo con ese nombre.'); return; }

  const costoUnitario = costoTotal / contenido;
  const materialPayload = {nombre, unidad, contenido, costo_total: costoTotal, costo_unitario: costoUnitario, merma_pct: mermaPct};

  if(editingMaterialId){
    const original = appData.materiales.find(m => m.id === editingMaterialId);
    const unidadCambio = original && original.unidad !== unidad;
    const afectadas = unidadCambio ? appData.recipes.filter(r => r.ingredientes.some(i => i.materialId === editingMaterialId)) : [];

    if(unidadCambio && afectadas.length > 0){
      const factor = unitConversionFactor(original.unidad, unidad);
      pendingMaterialSave = {materialPayload, afectadas, oldUnidad: original.unidad, newUnidad: unidad, factor};
      renderUnitChangeModal();
      return;
    }

    if(!confirm('Vas a modificar un insumo existente. El costo de todas las recetas que lo usan se va a actualizar. ¿Confirmar los cambios?')) return;
    const {error} = await sb.from('materiales').update({
      ...materialPayload, modificado_por: currentUser.usuario, modificado_en: new Date().toISOString()
    }).eq('id', editingMaterialId);
    if(error){ alert('No se pudo guardar: ' + error.message); return; }
  } else {
    const {error} = await sb.from('materiales').insert({
      ...materialPayload, creado_por: currentUser.usuario, creado_en: new Date().toISOString()
    });
    if(error){ alert('No se pudo guardar: ' + error.message); return; }
  }
  editingMaterialId = null;
  await refresh();
}

function renderUnitChangeModal(){
  const {afectadas, oldUnidad, newUnidad, factor} = pendingMaterialSave;
  const convertible = factor !== null;
  let rows = '';
  afectadas.forEach(r => {
    r.ingredientes.forEach((ing, ingIdx) => {
      if(ing.materialId !== editingMaterialId) return;
      const nuevaSugerida = convertible ? +(ing.cantidad * factor).toFixed(4) : ing.cantidad;
      rows += `<tr>
        <td>${escapeHtml(r.nombre)}</td>
        <td class="mono">${ing.cantidad} ${oldUnidad}</td>
        <td><input type="number" min="0" step="0.0001" value="${nuevaSugerida}" data-recipe-id="${r.id}" data-ing-idx="${ingIdx}" class="unit-conv-input" style="width:110px;"> ${newUnidad}</td>
      </tr>`;
    });
  });

  const html = `
  <div class="editor-overlay">
    <div class="editor" style="max-width:560px;">
      <h2 style="color:var(--brick);">Cambio de unidad detectado</h2>
      <p style="font-size:13.5px;line-height:1.6;">
        Este insumo va a pasar de <b>${oldUnidad}</b> a <b>${newUnidad}</b>, y ya está usado en ${afectadas.length} receta${afectadas.length===1?'':'s'}.
        ${convertible
          ? 'Convertí automáticamente las cantidades para que sigan representando lo mismo — revisalas y corregilas si hace falta antes de guardar.'
          : '<b style="color:var(--brick);">No se puede convertir automáticamente</b> entre estas unidades. Ingresá manualmente la cantidad correcta para cada receta antes de guardar.'}
      </p>
      <table class="ing-table" style="margin-top:14px;">
        <tr><th>Receta</th><th>Cantidad actual</th><th>Cantidad nueva</th></tr>
        ${rows}
      </table>
      <div class="editor-actions">
        <button class="btn btn-ghost" onclick="cancelUnitChangeModal()">Cancelar</button>
        <button class="btn btn-gold" onclick="confirmUnitChangeAndSave()">Guardar y actualizar recetas</button>
      </div>
    </div>
  </div>`;
  document.getElementById('editor-root').innerHTML = html;
}

function cancelUnitChangeModal(){
  pendingMaterialSave = null;
  document.getElementById('editor-root').innerHTML = '';
}

async function confirmUnitChangeAndSave(){
  const inputs = document.querySelectorAll('.unit-conv-input');
  const updatesByRecipe = {};
  inputs.forEach(inp => {
    const recipeId = inp.getAttribute('data-recipe-id');
    const ingIdx = parseInt(inp.getAttribute('data-ing-idx'), 10);
    const nuevaCantidad = parseFloat(inp.value) || 0;
    if(!updatesByRecipe[recipeId]) updatesByRecipe[recipeId] = [];
    updatesByRecipe[recipeId].push({ingIdx, nuevaCantidad});
  });

  try{
    for(const recipeId of Object.keys(updatesByRecipe)){
      const receta = appData.recipes.find(r => r.id === recipeId);
      const nuevosIngredientes = receta.ingredientes.map((ing, idx) => {
        const upd = updatesByRecipe[recipeId].find(u => u.ingIdx === idx);
        return upd ? {...ing, cantidad: upd.nuevaCantidad} : ing;
      });
      const {error} = await sb.from('recetas').update({
        ingredientes: nuevosIngredientes.map(i => ({materialId: i.materialId, cantidad: i.cantidad, unidadReceta: null})),
        modificado_por: currentUser.usuario, modificado_en: new Date().toISOString()
      }).eq('id', recipeId);
      if(error) throw error;
    }

    const {error} = await sb.from('materiales').update({
      ...pendingMaterialSave.materialPayload,
      modificado_por: currentUser.usuario, modificado_en: new Date().toISOString()
    }).eq('id', editingMaterialId);
    if(error) throw error;
  }catch(e){
    console.error(e);
    alert('No se pudo completar la actualización: ' + e.message);
    return;
  }

  pendingMaterialSave = null;
  editingMaterialId = null;
  document.getElementById('editor-root').innerHTML = '';
  await refresh();
}

/* ---------------- FOOD COST CALC ---------------- */

function materialCosto(materialId){
  const m = appData.materiales.find(x => x.id === materialId);
  if(!m) return 0;
  const merma = m.mermaPct || 0;
  if(merma <= 0 || merma >= 100) return m.costoUnitario;
  return m.costoUnitario / (1 - merma / 100);
}

function ingredienteUnidad(ing, mat){
  return (ing.unidadReceta && UNIT_GROUP[ing.unidadReceta] === UNIT_GROUP[mat.unidad]) ? ing.unidadReceta : mat.unidad;
}

function ingredienteCostoPorUnidadReceta(ing, mat){
  const unidadReceta = ingredienteUnidad(ing, mat);
  const factor = unitConversionFactor(unidadReceta, mat.unidad) || 1;
  return materialCosto(mat.id) * factor;
}

function ingredienteLineCost(ing){
  const mat = appData.materiales.find(m => m.id === ing.materialId);
  if(!mat) return 0;
  return (ing.cantidad || 0) * ingredienteCostoPorUnidadReceta(ing, mat);
}

function computeTotals(r){
  const costoTotal = r.ingredientes.reduce((s,i) => s + ingredienteLineCost(i), 0);
  const porciones = (r.usaPorciones === false) ? 1 : (r.porciones || 1);
  const costoPorPorcion = costoTotal / porciones;
  const multiplicador = r.multiplicador || 1;
  const usaManual = r.usarPrecioManual && r.precioVentaManual > 0;
  const precioVenta = usaManual ? r.precioVentaManual : (costoPorPorcion * multiplicador);
  const multiplicadorEfectivo = costoPorPorcion > 0 ? precioVenta / costoPorPorcion : multiplicador;
  const foodCostPct = precioVenta > 0 ? (costoPorPorcion / precioVenta) * 100 : 0;
  const margenPct = 100 - foodCostPct;
  const gananciaPorPorcion = precioVenta - costoPorPorcion;
  return {costoTotal, costoPorPorcion, multiplicador, multiplicadorEfectivo, precioVenta, foodCostPct, margenPct, gananciaPorPorcion, usaManual};
}

/* ---------------- EDITOR ---------------- */

function openEditor(recipeId){
  adjuntosAbiertos = false;
  if(recipeId){
    const orig = appData.recipes.find(r => r.id === recipeId);
    editingRecipe = JSON.parse(JSON.stringify(orig));
    editingRecipe._savedIngredientes = JSON.stringify(
      (orig.ingredientes||[]).map(i => ({materialId:i.materialId, cantidad:i.cantidad, unidadReceta:i.unidadReceta||null})).sort((a,b)=>(a.materialId||'').localeCompare(b.materialId||''))
    );
  } else {
    if(appData.materiales.length === 0 && canEdit()){
      alert('Primero cargá algunos insumos en "Modificar precio de materia prima" para poder agregarlos a la receta.');
    }
    editingRecipe = {
      id: uid(),
      nombre: '',
      categoria: activeTab || (appData.categories[0] || ''),
      porciones: 1,
      multiplicador: 3,
      imagen: null,
      manual: '',
      manualPdf: null,
      usarComoMateriaPrima: false,
      rendimientoGramos: null,
      seVende: true,
      usaPorciones: true,
      usarPrecioManual: false,
      precioVentaManual: null,
      materialLinkId: null,
      ingredientes: [ {id: uid(), materialId: null, cantidad: 0} ]
    };
  }
  renderEditor();
}

function closeEditor(){
  editingRecipe = null;
  document.getElementById('editor-root').innerHTML = '';
}

function syncEditorFieldsFromDom(){
  if(!editingRecipe) return;
  const nombreEl = document.getElementById('ed-nombre');
  if(!nombreEl) return;
  editingRecipe.nombre = nombreEl.value;
  editingRecipe.categoria = document.getElementById('ed-categoria').value;
  editingRecipe.porciones = parseFloat(document.getElementById('ed-porciones').value) || editingRecipe.porciones;
}

function renderEditor(){
  syncEditorFieldsFromDom();
  const activeEl = document.activeElement;
  const editorRoot = document.getElementById('editor-root');
  const preservedFocusId = (activeEl && activeEl.id && editorRoot && editorRoot.contains(activeEl)) ? activeEl.id : null;
  const preservedSelStart = (preservedFocusId && typeof activeEl.selectionStart === 'number') ? activeEl.selectionStart : null;
  const preservedSelEnd = (preservedFocusId && typeof activeEl.selectionEnd === 'number') ? activeEl.selectionEnd : null;
  const r = editingRecipe;
  const readOnly = !canEdit();
  const totals = computeTotals(r);
  let ingRows = '';
  r.ingredientes.forEach((ing, idx) => {
    const mat = appData.materiales.find(m => m.id === ing.materialId);
    const displayName = mat ? mat.nombre : (ing._typed || '');
    const notFound = !mat && displayName;
    const unidadReceta = mat ? ingredienteUnidad(ing, mat) : null;

  document.getElementById('editor-root').innerHTML = html;

function currentIngredientesSignature(){
  return JSON.stringify(
    editingRecipe.ingredientes.map(i => ({materialId:i.materialId, cantidad:i.cantidad, unidadReceta:i.unidadReceta||null})).sort((a,b)=>(a.materialId||'').localeCompare(b.materialId||''))
  );
}

async function uploadToStorage(file, folder){
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g,'') || 'bin';
  const path = `${folder}/${uid()}.${ext}`;
  const {error} = await sb.storage.from('recetario-archivos').upload(path, file, {cacheControl: '3600', upsert: false});
  if(error) throw error;
  const {data} = sb.storage.from('recetario-archivos').getPublicUrl(path);
  return {url: data.publicUrl, path};
}

async function handleManualPdfUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  const isExisting = appData.recipes.some(r => r.id === editingRecipe.id);
  if(!isExisting){
    alert('Primero guardá la receta. Después vas a poder subir el manual en PDF.');
    event.target.value = '';
    return;
  }
  if(editingRecipe._savedIngredientes && currentIngredientesSignature() !== editingRecipe._savedIngredientes){
    alert('Los insumos de la receta cambiaron y todavía no guardaste esos cambios. Guardá la receta primero para que el manual coincida con los ingredientes actuales, y después subí el PDF.');
    event.target.value = '';
    return;
  }
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if(!isPdf){
    alert('El manual de uso debe subirse en formato PDF.');
    event.target.value = '';
    return;
  }
  if(file.size > 8 * 1024 * 1024){
    alert('El PDF es muy pesado. Usá uno de menos de 8 MB.');
    event.target.value = '';
    return;
  }
  const btnParent = event.target.parentElement;
  const original = btnParent ? btnParent.innerHTML : '';
  try{
    if(btnParent) btnParent.innerHTML = '<p class="dim" style="font-size:12.5px;">Subiendo PDF&hellip;</p>';
    const {url} = await uploadToStorage(file, 'manuales');
    editingRecipe.manualPdf = {name: file.name, data: url};
    renderEditor();
  }catch(e){
    console.error(e);
    alert('No se pudo subir el PDF: ' + e.message);
    if(btnParent) btnParent.innerHTML = original;
  }
}

function removeManualPdf(){
  if(!confirm('¿Quitar el manual en PDF de esta receta?')) return;
  editingRecipe.manualPdf = null;
  renderEditor();
}

async function handleImageUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 4 * 1024 * 1024){
    alert('La imagen es muy pesada. Usá una de menos de 4 MB.');
    event.target.value = '';
    return;
  }
  const box = event.target.closest('.img-upload-box');
  const original = box ? box.innerHTML : '';
  try{
    if(box) box.innerHTML = '<p class="dim" style="font-size:12.5px;">Subiendo imagen&hellip;</p>';
    const {url} = await uploadToStorage(file, 'imagenes');
    editingRecipe.imagen = url;
    renderEditor();
  }catch(e){
    console.error(e);
    alert('No se pudo subir la imagen: ' + e.message);
    if(box) box.innerHTML = original;
  }
}

function removeImage(){
  editingRecipe.imagen = null;
  renderEditor();

function renderPickerListItems(query){

    .filter(m => m.nombre.toLowerCase().includes(q))

      onmouseover="this.style.background='var(--card-hover)'" onmouseout="this.style.background='transparent'">
      <div>

        <div style="font-size:11.5px;color:var(--muted);">${m.unidad}${m.mermaPct > 0 ? ` &middot; merma ${m.mermaPct}%` : ''}</div>
      </div>

  renderPickerListItems(v);
}

function selectMaterialFromPicker(materialId){
  const mat = appData.materiales.find(m => m.id === materialId);
  if(!mat) return;
  if(pickerTargetIdx === null){
    editingRecipe.ingredientes.push({id: uid(), materialId: mat.id, cantidad: 0, unidadReceta: mat.unidad, _typed: ''});
  } else {
    const ing = editingRecipe.ingredientes[pickerTargetIdx];
    ing.materialId = mat.id;
    ing._typed = '';
    ing.unidadReceta = mat.unidad;
  }
  closeMaterialPicker();
  renderEditor();

function closeMaterialPicker(){

  document.getElementById('picker-root').innerHTML = '';

function refreshComputedUI(){
  if(!editingRecipe) return;
  const r = editingRecipe;
  const totals = computeTotals(r);

  r.ingredientes.forEach((ing, idx) => {
    const mat = appData.materiales.find(m => m.id === ing.materialId);
    const costoUnitario = mat ? ingredienteCostoPorUnidadReceta(ing, mat) : 0;
    const subtotal = (ing.cantidad || 0) * costoUnitario;
    const elSub = document.getElementById(`ing-subtotal-${idx}`);
    if(elSub) elSub.innerHTML = money(subtotal);
    const elCosto = document.getElementById(`ing-costo-${idx}`);
    if(elCosto) elCosto.innerHTML = moneyPrecio(costoUnitario) + (mat && mat.mermaPct > 0 ? `<div style="font-size:10.5px;color:var(--amber);">merma ${mat.mermaPct}%</div>` : '');
  });

  const setText = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };
  setText('stat-costo-total', money(totals.costoTotal));
  setText('stat-costo-porcion', money(totals.costoPorPorcion));
  setText('stat-precio-venta', money(totals.precioVenta));
  setText('stat-food-cost', totals.foodCostPct.toFixed(1) + '%');
  setText('stat-ganancia', money(totals.gananciaPorPorcion));

  const multEl = document.getElementById('ed-multiplicador');
  const margEl = document.getElementById('ed-margen');
  if(multEl && document.activeElement !== multEl) multEl.value = r.multiplicador;
  if(margEl && document.activeElement !== margEl) margEl.value = totals.margenPct.toFixed(1);

  const sumaEl = document.getElementById('ing-suma-total');
  if(sumaEl) sumaEl.innerHTML = sumaRecetaHtml(r);
  const rendPreview = document.getElementById('rendimiento-preview');
  if(rendPreview) rendPreview.innerHTML = rendimientoPreviewHtml(totals.costoTotal, r.rendimientoGramos);
}

const BASE_UNIT_OF_GROUP = {peso:'g', volumen:'ml', unidad:'unidad'};

function sumaPorGrupo(r){
  const sumas = {peso: 0, volumen: 0, unidad: 0};
  r.ingredientes.forEach(ing => {
    const mat = appData.materiales.find(m => m.id === ing.materialId);
    if(!mat) return;
    const grupo = UNIT_GROUP[mat.unidad];
    const unidadReceta = ingredienteUnidad(ing, mat);
    const factor = unitConversionFactor(unidadReceta, BASE_UNIT_OF_GROUP[grupo]) || 1;
    sumas[grupo] += (ing.cantidad || 0) * factor;
  });
  // Referencia de peso: 1 ml de líquido se toma como 1 g (1 l = 1 kg), solo para
  // estimar cuánto rinde la receta en gramos cuando lleva insumos líquidos.
  sumas.referencia = sumas.peso + sumas.volumen;
  return sumas;
}

function sumaRecetaHtml(r){
  const s = sumaPorGrupo(r);
  const partes = [];
  if(s.peso > 0) partes.push(`<b style="color:var(--cream);">${s.peso.toFixed(1)} g</b> de peso`);
  if(s.volumen > 0) partes.push(`<b style="color:var(--cream);">${s.volumen.toFixed(1)} ml</b> de volumen`);
  if(s.unidad > 0) partes.push(`<b style="color:var(--cream);">${s.unidad}</b> unidad${s.unidad===1?'':'es'}`);
  if(partes.length === 0) return 'Agregá insumos para ver cuánto suma la receta en total.';
  let extra = '';
  if(s.peso > 0 && s.volumen > 0){
    extra = ` Tomando 1 litro como 1 kilo, el peso de referencia total es de <b style="color:var(--gold);">${s.referencia.toFixed(1)} g</b>.`;
  }
  return `Suma total de la receta: ${partes.join(' + ')}.${extra} Usalo como referencia para completar cuánto rinde en gramos.`;
}

function rendimientoPreviewHtml(costoTotal, gramos){
  if(!gramos || gramos <= 0){
    return 'Indicá cuántos gramos rinde en total esta receta (por ejemplo, si la olla te da 2 kg de salsa, poné 2000). Con eso se calcula el costo por gramo y por kilo que se va a guardar en Materia prima.';
  }
  const costoPorGramo = costoTotal / gramos;
  const costoPorKg = costoPorGramo * 1000;
  return `Esta receta rinde ${gramos} g en total. Costo por gramo: <b style="color:var(--gold);">${moneyPrecio(costoPorGramo)}</b> &middot; costo por kilo: <b style="color:var(--gold);">${money(costoPorKg)}</b>. Esto es lo que se va a guardar en Materia prima.`;
}

function duplicarReceta(){
  if(!confirm('¿Duplicar esta receta? Se va a crear una copia nueva sin guardar todavía, para que la ajustes y le pongas otro nombre.')) return;
  const copia = JSON.parse(JSON.stringify(editingRecipe));
  copia.id = uid();
  copia.nombre = copia.nombre + ' (copia)';
  copia.materialLinkId = null;
  copia.usarComoMateriaPrima = false;
  copia.imagen = null;
  copia.manualPdf = null;
  copia.creadoPor = null; copia.creadoEn = null; copia.modificadoPor = null; copia.modificadoEn = null;
  delete copia._savedIngredientes;
  editingRecipe = copia;
  adjuntosAbiertos = false;
  renderEditor();
}

function imprimirReceta(){
  const r = editingRecipe;
  const totals = computeTotals(r);
  const filas = r.ingredientes.map(ing => {
    const mat = appData.materiales.find(m => m.id === ing.materialId);
    if(!mat) return '';
    const unidad = ingredienteUnidad(ing, mat);
    return `<tr><td>${escapeHtml(mat.nombre)}</td><td style="text-align:right;">${ing.cantidad} ${unidad}</td></tr>`;
  }).join('');

  const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
    <title>${escapeHtml(r.nombre)}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:30px;color:#111;max-width:700px;margin:0 auto;}
      h1{margin-bottom:4px;} .cat{color:#666;margin-bottom:20px;}
      table{width:100%;border-collapse:collapse;margin-bottom:24px;}
      th,td{padding:8px 6px;border-bottom:1px solid #ddd;text-align:left;}
      img{max-width:280px;border-radius:6px;margin-bottom:16px;display:block;}
      .manual{white-space:pre-wrap;line-height:1.6;border:1px solid #ddd;border-radius:6px;padding:14px;}
      @media print{ button{display:none;} }
    </style></head><body>
    <button onclick="window.print()" style="padding:8px 16px;margin-bottom:16px;">Imprimir</button>
    <h1>${escapeHtml(r.nombre)}</h1>
    <div class="cat">${escapeHtml(r.categoria)}${r.usaPorciones ? ` &middot; ${r.porciones} porción${r.porciones==1?'':'es'}` : ''}</div>
    ${r.imagen ? `<img src="${r.imagen}">` : ''}
    <table><tr><th>Insumo</th><th style="text-align:right;">Cantidad</th></tr>${filas}</table>
    ${r.manualPdf ? `<p>Manual de uso: <a href="${r.manualPdf.data}" target="_blank">${escapeHtml(r.manualPdf.name)}</a></p>` : ''}
  </body></html>`;

  const w = window.open('', '_blank');
  if(!w){ alert('El navegador bloqueó la ventana de impresión. Habilitá las ventanas emergentes para este sitio.'); return; }
  w.document.write(html);
  w.document.close();
}

async function saveRecipe(){
  editingRecipe.nombre = document.getElementById('ed-nombre').value.trim();
  editingRecipe.categoria = document.getElementById('ed-categoria').value;
  editingRecipe.porciones = parseFloat(document.getElementById('ed-porciones').value) || 1;
  editingRecipe.multiplicador = parseFloat(document.getElementById('ed-multiplicador').value) || 1;
  editingRecipe.usarComoMateriaPrima = document.getElementById('ed-es-materia-prima') ? document.getElementById('ed-es-materia-prima').checked : false;
  editingRecipe.seVende = document.getElementById('ed-se-vende') ? document.getElementById('ed-se-vende').checked : true;
  editingRecipe.usaPorciones = document.getElementById('ed-usa-porciones') ? document.getElementById('ed-usa-porciones').checked : true;
  editingRecipe.usarPrecioManual = document.getElementById('ed-precio-manual') ? document.getElementById('ed-precio-manual').checked : false;
  editingRecipe.precioVentaManual = document.getElementById('ed-precio-venta-manual') ? (parseFloat(document.getElementById('ed-precio-venta-manual').value) || 0) : editingRecipe.precioVentaManual;

  if(editingRecipe.usarPrecioManual && (!editingRecipe.precioVentaManual || editingRecipe.precioVentaManual <= 0)){
    alert('Escribí el precio de venta que querés fijar, o desmarcá la opción de precio manual.');
    return;
  }
  editingRecipe.rendimientoGramos = document.getElementById('ed-rendimiento-gramos') ? (parseFloat(document.getElementById('ed-rendimiento-gramos').value) || 0) : editingRecipe.rendimientoGramos;

  if(!editingRecipe.nombre){ alert('Ponle un nombre a la receta.'); return; }

  if(editingRecipe.usarComoMateriaPrima && (!editingRecipe.rendimientoGramos || editingRecipe.rendimientoGramos <= 0)){
    alert('Para usar esta receta como insumo de materia prima, indicá cuántos gramos rinde en total (por ejemplo, 2000 si la olla te da 2 kg).');
    return;
  }

  const dupName = appData.recipes.some(x => x.id !== editingRecipe.id && x.nombre.trim().toLowerCase() === editingRecipe.nombre.toLowerCase());
  if(dupName){ alert('Ya existe una receta con ese nombre. No se pueden repetir nombres de receta, elegí otro.'); return; }

  if(editingRecipe.ingredientes.some(i => !i.materialId)){
    if(!confirm('Hay insumos sin seleccionar de la lista de Materia prima. ¿Guardar de todas formas?')) return;
  }
  editingRecipe.ingredientes = editingRecipe.ingredientes.filter(i => i.materialId || i.cantidad);

  const isExisting = appData.recipes.some(r => r.id === editingRecipe.id);
  if(isExisting){
    if(!confirm('Vas a modificar una receta existente. Esto puede cambiar su costo y el de cualquier plato que la use como insumo. ¿Confirmar los cambios?')) return;
  }

  const totals = computeTotals(editingRecipe);

  try{
    if(editingRecipe.usarComoMateriaPrima){
      const gramos = editingRecipe.rendimientoGramos;
      const costoTotalPreparacion = totals.costoTotal;
      if(editingRecipe.materialLinkId){
        const {error} = await sb.from('materiales').update({
          nombre: editingRecipe.nombre, unidad: 'g', contenido: gramos,
          costo_total: costoTotalPreparacion, costo_unitario: costoTotalPreparacion / gramos,
          modificado_por: currentUser.usuario, modificado_en: new Date().toISOString()
        }).eq('id', editingRecipe.materialLinkId);
        if(error) throw error;
      } else {
        const dupMat = appData.materiales.find(m => m.nombre.toLowerCase() === editingRecipe.nombre.toLowerCase());
        if(dupMat){
          const {error} = await sb.from('materiales').update({
            unidad: 'g', contenido: gramos, costo_total: costoTotalPreparacion,
            costo_unitario: costoTotalPreparacion / gramos, generado_por_receta: true,
            modificado_por: currentUser.usuario, modificado_en: new Date().toISOString()
          }).eq('id', dupMat.id);
          if(error) throw error;
          editingRecipe.materialLinkId = dupMat.id;
        } else {
          const {data, error} = await sb.from('materiales').insert({
            nombre: editingRecipe.nombre, unidad: 'g', contenido: gramos,
            costo_total: costoTotalPreparacion, costo_unitario: costoTotalPreparacion / gramos,
            generado_por_receta: true,
            creado_por: currentUser.usuario, creado_en: new Date().toISOString()
          }).select().single();
          if(error) throw error;
          editingRecipe.materialLinkId = data.id;
        }
      }
    } else if(editingRecipe.materialLinkId){
      const enUso = appData.recipes.some(r => r.id !== editingRecipe.id && r.ingredientes.some(i => i.materialId === editingRecipe.materialLinkId));
      if(enUso){
        alert('Esta preparación está siendo usada como insumo en otra receta, así que se mantiene en Materia prima aunque desmarques la casilla.');
        editingRecipe.usarComoMateriaPrima = true;
      } else {
        const {error} = await sb.from('materiales').delete().eq('id', editingRecipe.materialLinkId);
        if(error) throw error;
        editingRecipe.materialLinkId = null;
      }
    }

    const payload = {
      nombre: editingRecipe.nombre,
      categoria: editingRecipe.categoria,
      porciones: editingRecipe.porciones,
      multiplicador: editingRecipe.multiplicador,
      imagen: editingRecipe.imagen,
      manual_pdf_nombre: editingRecipe.manualPdf ? editingRecipe.manualPdf.name : null,
      manual_pdf_data: editingRecipe.manualPdf ? editingRecipe.manualPdf.data : null,
      usar_como_materia_prima: editingRecipe.usarComoMateriaPrima,
      se_vende: editingRecipe.seVende,
      usa_porciones: editingRecipe.usaPorciones,
      usar_precio_manual: editingRecipe.usarPrecioManual,
      precio_venta_manual: editingRecipe.usarPrecioManual ? editingRecipe.precioVentaManual : null,
      material_link_id: editingRecipe.materialLinkId,
      rendimiento_gramos: editingRecipe.rendimientoGramos || null,
      ingredientes: editingRecipe.ingredientes.map(i => ({materialId: i.materialId, cantidad: i.cantidad, unidadReceta: i.unidadReceta || null}))
    };

    if(isExisting){
      payload.modificado_por = currentUser.usuario;
      payload.modificado_en = new Date().toISOString();
      const {error} = await sb.from('recetas').update(payload).eq('id', editingRecipe.id);
      if(error) throw error;
    } else {
      payload.creado_por = currentUser.usuario;
      payload.creado_en = new Date().toISOString();
      const {error} = await sb.from('recetas').insert(payload);
      if(error) throw error;
    }
  }catch(e){
    console.error(e);
    alert('No se pudo guardar la receta: ' + e.message);
    return;
  }

  activeTab = editingRecipe.categoria;
  currentSection = 'recetas';
  closeEditor();
  await refresh();
}

async function deleteRecipe(id){
  const recipe = appData.recipes.find(r => r.id === id);
  if(!recipe) return;
  if(recipe.materialLinkId){
    const enUsoEnOtras = appData.recipes.some(r => r.id !== id && r.ingredientes.some(i => i.materialId === recipe.materialLinkId));
    if(enUsoEnOtras){
      alert('No se puede eliminar: esta receta generó un insumo de Materia prima que está siendo usado en otras recetas. Quitalo primero de esas recetas.');
      return;
    }
  }
  if(!confirm(`¿Eliminar la receta "${recipe.nombre}"? Va a la papelera y la podés restaurar desde ahí si te equivocaste${recipe.materialLinkId ? ' (también se archiva el insumo que generó en Materia prima).' : '.'}`)) return;

  const {error} = await sb.from('recetas').update({
    eliminado: true, eliminado_por: currentUser.usuario, eliminado_en: new Date().toISOString()
  }).eq('id', id);
  if(error){ alert('No se pudo eliminar: ' + error.message); return; }
  if(recipe.materialLinkId){
    await sb.from('materiales').update({
      eliminado: true, eliminado_por: currentUser.usuario, eliminado_en: new Date().toISOString()
    }).eq('id', recipe.materialLinkId);
  }
  closeEditor();
  await refresh();
}

/* ---------------- UTIL ---------------- */

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
